# ==========================================
# CONFIGURAÇÕES DO SERVIDOR E APLICAÇÃO
# ==========================================
# Na nuvem, a porta costuma ser injetada via PORT; localmente mantém 8081
server.port=${PORT:8081}
spring.application.name=realtime-chat-api

# ==========================================
# CONFIGURAÇÕES DO BANCO DE DADOS (POSTGRESQL)
# ==========================================
# Em produção, o provedor injeta DB_URL, DB_USER e DB_PASSWORD.
# Localmente, utiliza as suas credenciais atuais do Docker.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/realtime_chat}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:1234}

# ==========================================
# CONFIGURAÇÕES DO HIBERNATE / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Exibe e formata as queries SQL no console durante o desenvolvimento
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SEGURANÇA E JWT
# ==========================================
# Chave secreta para assinatura dos tokens JWT
api.security.token.secret=${JWT_SECRET:chave_secreta_provisoria_para_localhost_123}